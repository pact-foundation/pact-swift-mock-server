codecov:
  require_ci_to_pass: true

comment:
  behavior: default
  layout: "header, diff"
  require_changes: false

coverage:
  precision: 2
  round: down
  range: "75...100"
  status:
    project:
      default:
        target: auto
    patch:
      default:
        target: auto

ignore:
  - "Resources/**/*"
  - "Support/**/*"

parsers:
  gcov:
    branch_detection:
      conditional: true
      loop: true
      macro: false
      method: false
